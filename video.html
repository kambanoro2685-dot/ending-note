<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>わたしの人生すごろく 紹介動画</title>
<style>
:root{--bg:#fff8ee;--ink:#3a3128;--accent:#e8743b;--sub:#8a7b6a}
@media (prefers-color-scheme:dark){:root{--bg:#1d1814;--ink:#f1e8dc;--accent:#f08a55;--sub:#b3a592}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;text-align:center}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px}
h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.1em;font-size:1.5rem;margin:.4em 0}
p{color:var(--sub)}
video{width:100%;border-radius:14px;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.25)}
a.btn{display:inline-block;margin-top:14px;padding:.7em 1.4em;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>わたしの人生すごろく</h1>
  <p>エンディングノートを、人生ゲームのマスにして書き残すアプリの紹介動画（40秒・音声あり）</p>
  <video src="intro.mp4" controls playsinline preload="metadata"></video>
  <p>※ 動画内の文章は、紹介用の架空のサンプルです。</p>
  <a class="btn" href="./">アプリを使ってみる</a>
</div>
</body>
</html>
